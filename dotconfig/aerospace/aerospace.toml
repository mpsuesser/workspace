config-version = 2
start-at-login = true

# Hammerspoon owns F8, the radial menu, app selection, and cancellation.
# The reserved empty workspace reveals the desktop on the active display.
persistent-workspaces = ["main", "launcher"]

# Ordinary macOS window placement and Cmd+H behavior; no app/monitor routing.
automatically-unhide-macos-hidden-apps = false
on-focused-monitor-changed = []

[[on-window-detected]]
run = 'layout floating'

# No global move/resize shortcuts. F9 remains reserved for Hex recording.
[mode.main.binding]
