id = "local.workspace-kinds"
name = "Workspace Kinds"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Classify workspaces and run kind-specific creation workflows."
platforms = ["macos"]

[[startup]]
command = ["sh", "scripts/classify-workspaces"]

[[actions]]
id = "create"
title = "Create categorized workspace"
contexts = ["global"]
command = ["sh", "scripts/open-create-popup"]

[[events]]
on = "workspace.created"
command = ["sh", "scripts/classify-workspaces"]

[[events]]
on = "workspace.renamed"
command = ["sh", "scripts/classify-workspaces"]

[[panes]]
id = "create"
title = "Create workspace"
placement = "popup"
width = "70%"
height = 18
command = ["sh", "scripts/create-workspace"]
