onboarding = false

[theme]
name = "catppuccin"

[terminal]
new_cwd = "~/repos"

[keys]
prefix = "cmd+shift+;"
settings = "prefix+comma"
workspace_picker = "prefix+space"
new_workspace = ""
rename_workspace = ["prefix+r", "cmd+shift+r"]
detach = "prefix+shift+q"
previous_workspace = "cmd+shift+w"
next_workspace = "cmd+shift+s"
switch_workspace = "cmd+1..9"
previous_agent = "prefix+alt+["
next_agent = "prefix+alt+]"
focus_agent = "prefix+alt+1..9"

focus_pane_up = ["cmd+w", "cmd+alt+up"]
focus_pane_down = ["cmd+s", "cmd+alt+down"]
focus_pane_left = ["cmd+a", "cmd+alt+left"]
focus_pane_right = ["cmd+d", "cmd+alt+right"]

split_horizontal = "cmd+shift+p"
split_vertical = "cmd+p"
close_pane = "cmd+q"
zoom = "cmd+e"
rename_tab = "cmd+r"
new_tab = "cmd+t"
close_tab = "cmd+alt+w"
previous_tab = "prefix+p"
next_tab = "cmd+shift+d"
cycle_pane_previous = "cmd+["
cycle_pane_next = "prefix+tab"

edit_scrollback = "prefix+shift+e"
resize_mode = "prefix+alt+r"

[ui]
sidebar_width = 39
sidebar_min_width = 27
sidebar_max_width = 54
agent_panel_sort = "priority"
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
pane_scrollbars = false

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [{ token = "terminal_title_stripped", dim = true }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [[
  "state_icon",
  { token = "$kind_agent", fg = "#89b4fa", bold = true },
  { token = "$kind_post", fg = "#fab387", bold = true },
  { token = "$kind_skill", fg = "#cba6f7", bold = true },
  { token = "$kind_project", fg = "#a6e3a1", bold = true },
  "$workspace_title",
]]

[experimental]
kitty_graphics = true

[[keys.command]]
key = "cmd+k"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "cmd+f8"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "cmd+shift+a"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "cmd+;"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "cmd+o"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "local.workspace-kinds.create"
description = "create categorized workspace"

[[keys.command]]
key = "cmd+shift+n"
type = "plugin_action"
command = "local.workspace-kinds.create"
description = "create categorized workspace"

[[keys.command]]
key = "cmd+ctrl+shift+w"
type = "shell"
command = "$HOME/.config/herdr/scripts/move-workspace up"
description = "move workspace up"

[[keys.command]]
key = "cmd+ctrl+shift+s"
type = "shell"
command = "$HOME/.config/herdr/scripts/move-workspace down"
description = "move workspace down"

[ui.toast]
delivery = "system"
